<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15251e"><link rel="manifest" href="/manifest.webmanifest"><title>Kitchen Mode — Recipe Reader</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f8f7ef;background:#15251e;font-size:18px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;min-height:100dvh;padding:20px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:1.1rem;font-weight:850;letter-spacing:-.03em}.sub{color:#b3c2b8;font-size:.8rem}.iconbtn{border:1px solid #506558;background:#273d31;color:white;border-radius:12px;padding:10px 12px}.panel{background:#23372c;border:1px solid #405c49;border-radius:22px;padding:22px}.intro{display:grid;gap:13px}.intro h1{margin:0;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.05;letter-spacing:-.045em}label{font-size:.8rem;color:#c6d3c9;font-weight:700}input,textarea{width:100%;background:#13251b;border:1px solid #6b8271;border-radius:12px;color:white;padding:15px;outline-offset:3px}textarea{min-height:110px;resize:vertical}input::placeholder,textarea::placeholder{color:#98ab9e}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;background:#d7f16f;color:#172619;font-weight:850;padding:15px 18px;border-radius:13px;min-height:54px}.btn.secondary{background:#395343;color:white}.btn:disabled{opacity:.35;cursor:not-allowed}.status{font-size:.8rem;color:#cbd8cf;min-height:1.2em}.hidden{display:none!important}.reader{flex:1;display:flex;flex-direction:column;gap:15px}.progress{height:7px;background:#3a5140;border-radius:20px;overflow:hidden}.bar{height:100%;background:#d7f16f;transition:width .2s}.stepcard{flex:1;min-height:390px;display:flex;flex-direction:column;gap:18px;background:#f6f4e9;color:#1b3023;border-radius:25px;padding:clamp(22px,5vw,36px)}.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:#57705d}.stepcard h2{font-size:clamp(2rem,9vw,3.6rem);line-height:1.08;letter-spacing:-.055em;margin:0;overflow-wrap:anywhere}.steptext{font-size:calc(1.65rem * var(--scale,1));line-height:1.32;font-weight:760;white-space:pre-wrap;overflow-wrap:anywhere}.ingredients{display:grid;gap:8px}.ingredient{display:flex;gap:13px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #d8ded2;font-size:calc(1.25rem * var(--scale,1));font-weight:750;line-height:1.35}.ingredient input{width:25px;height:25px;flex:0 0 25px;accent-color:#3c6b40;margin:2px 0}.ingredient:has(input:checked) span{text-decoration:line-through;opacity:.5}.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}.nav button{min-height:64px;font-size:1.1rem}.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tools button{background:transparent;color:#e7efe8;border:1px solid #58705d;border-radius:9px;padding:9px 12px}.manual{display:grid;gap:12px}.manual details{margin-top:5px}.manual summary{cursor:pointer;font-weight:750}.small{font-size:.8rem;color:#c7d2c9}.titleline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.titleline button{flex-shrink:0}@media(max-width:420px){main{padding:14px 12px 22px}.panel{padding:17px}.stepcard{padding:23px;min-height:350px}}
</style></head><body><main><header class="top"><div><div class="brand">◉ Kitchen Mode</div><div class="sub">No stories. Just cooking.</div></div><button id="newRecipe" class="iconbtn hidden">＋ New recipe</button></header>
<section id="home" class="panel intro"><h1>Turn any recipe into easy steps.</h1><div><label for="url">RECIPE WEBPAGE</label><input id="url" type="url" placeholder="https://example.com/recipe" autocomplete="url" inputmode="url"></div><button id="load" class="btn">Make it cookable →</button><div id="status" class="status" role="status"></div><details><summary>Can't load a recipe? Enter it manually</summary><div class="manual"><label for="manualTitle">Recipe name</label><input id="manualTitle" placeholder="My dinner"><label for="manualIngredients">Ingredients (one per line)</label><textarea id="manualIngredients" placeholder="1 cup rice&#10;2 tbsp soy sauce"></textarea><label for="manualSteps">Steps (one per line; use a blank line for multi-line steps)</label><textarea id="manualSteps" placeholder="Cook the rice.&#10;Fry the tofu.&#10;Add the sauce."></textarea><button class="btn secondary" id="manualLoad">Open recipe</button></div></details><p class="small">Tip: In Android Chrome, use ⋮ → Add to Home screen after deploying.</p></section>
<section id="reader" class="reader hidden" aria-live="polite"><div class="titleline"><div><div id="recipeTitle" class="brand"></div><div id="counter" class="sub"></div></div><button class="iconbtn" id="ingredientsJump">Ingredients</button></div><div class="progress"><div class="bar" id="progress"></div></div><article class="stepcard" id="stepcard"><div class="eyebrow" id="eyebrow"></div><h2 id="heading"></h2><div id="stepbody"></div></article><div class="nav"><button class="btn secondary" id="back">← Back</button><button class="btn" id="next">Next →</button></div><div class="tools"><div class="actions"><button id="smaller" aria-label="Smaller text">A−</button><button id="larger" aria-label="Larger text">A＋</button></div><button id="awake" aria-pressed="false">Keep screen awake: Off</button></div></section></main><script>
const $=id=>document.getElementById(id);let recipe=null,index=0,scale=1,lock=null,checked=new Set();const demo={title:'Teriyaki Tofu Bowl',ingredients:['400 g firm tofu','2 cups broccoli','3 tbsp teriyaki sauce','2 cups cooked rice','1 tbsp cooking oil'],steps:['Cut the tofu into cubes and chop the broccoli.','Heat oil in a pan. Cook tofu until golden, about 8 minutes.','Add broccoli and a splash of water. Cook until tender.','Stir in teriyaki sauce. Serve over warm rice.']};
function normalize(r){return {title:String(r.title||'Untitled recipe'),ingredients:(r.ingredients||[]).map(String).filter(Boolean),steps:(r.steps||[]).map(String).filter(Boolean)}}
function showRecipe(r){recipe=normalize(r);if(!recipe.steps.length)throw Error('No cooking instructions were found. Try manual entry.');index=0;checked=new Set();$('home').classList.add('hidden');$('reader').classList.remove('hidden');$('newRecipe').classList.remove('hidden');render();window.scrollTo(0,0)}
function render(){if(!recipe)return;const total=recipe.steps.length+1;const ing=index===0;$('recipeTitle').textContent=recipe.title;$('counter').textContent=ing?'Ingredients first':`Step ${index} of ${recipe.steps.length}`;$('progress').style.width=`${(index+1)/total*100}%`;$('eyebrow').textContent=ing?'Get ready':`Step ${index} of ${recipe.steps.length}`;$('heading').textContent=ing?'Ingredients':`Let's cook`;$('stepbody').replaceChildren();if(ing){const list=document.createElement('div');list.className='ingredients';recipe.ingredients.forEach((txt,i)=>{const label=document.createElement('label');label.className='ingredient';const cb=document.createElement('input');cb.type='checkbox';cb.checked=checked.has(i);cb.addEventListener('change',()=>cb.checked?checked.add(i):checked.delete(i));const span=document.createElement('span');span.textContent=txt;label.append(cb,span);list.append(label)});if(!recipe.ingredients.length)list.textContent='No ingredients found. Check the original recipe.';$('stepbody').append(list)}else{const text=document.createElement('div');text.className='steptext';text.textContent=recipe.steps[index-1];$('stepbody').append(text)}$('back').disabled=index===0;$('next').textContent=index===recipe.steps.length?'Start over ↻':'Next →';$('stepcard').style.setProperty('--scale',scale);}
function move(n){index=Math.max(0,Math.min(recipe.steps.length,n));render();window.scrollTo({top:0,behavior:'smooth'})}
$('next').onclick=()=>move(index===recipe.steps.length?0:index+1);$('back').onclick=()=>move(index-1);$('ingredientsJump').onclick=()=>move(0);$('smaller').onclick=()=>{scale=Math.max(.8,+(scale-.1).toFixed(1));render()};$('larger').onclick=()=>{scale=Math.min(1.6,+(scale+.1).toFixed(1));render()};$('newRecipe').onclick=()=>{$('reader').classList.add('hidden');$('home').classList.remove('hidden');$('newRecipe').classList.add('hidden');$('status').textContent='';releaseWake()};
$('manualLoad').onclick=()=>{try{showRecipe({title:$('manualTitle').value||'My recipe',ingredients:$('manualIngredients').value.split('\n').map(x=>x.trim()).filter(Boolean),steps:$('manualSteps').value.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean)})}catch(e){$('status').textContent=e.message}};
$('load').onclick=async()=>{const url=$('url').value.trim();if(!/^https?:\/\//i.test(url)){$('status').textContent='Paste a complete http:// or https:// recipe link.';return}const btn=$('load');btn.disabled=true;btn.textContent='Reading recipe…';$('status').textContent='';try{const res=await fetch('/.netlify/functions/extract?url='+encodeURIComponent(url));const data=await res.json();if(!res.ok)throw Error(data.error||'Could not read this recipe.');showRecipe(data)}catch(e){$('status').textContent=e.message+' You can enter the recipe manually below.'}finally{btn.disabled=false;btn.textContent='Make it cookable →'}};
async function releaseWake(){if(lock){try{await lock.release()}catch(e){}lock=null}$('awake').textContent='Keep screen awake: Off';$('awake').setAttribute('aria-pressed','false')}
$('awake').onclick=async()=>{if(lock){await releaseWake();return}if(!('wakeLock'in navigator)){$('awake').textContent='Screen awake not supported';return}try{lock=await navigator.wakeLock.request('screen');$('awake').textContent='Keep screen awake: On';$('awake').setAttribute('aria-pressed','true');lock.addEventListener('release',()=>{lock=null;$('awake').textContent='Keep screen awake: Off';$('awake').setAttribute('aria-pressed','false')})}catch(e){$('awake').textContent='Screen awake unavailable'}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});const params=new URLSearchParams(location.search);if(params.has('url'))$('url').value=params.get('url');
</script></body></html>
